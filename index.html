<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Varsity Admission Batch 26</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0b1121; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
    
    .glass-nav { background: rgba(11, 17, 33, 0.85); backdrop-filter: blur(12px); }
  </style>

  <!-- Firebase Services -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDocs, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC3H7jNADw534DVBV8rQLZ2oSw0-oyybLA",
      authDomain: "admission-batch-26.firebaseapp.com",
      projectId: "admission-batch-26",
      storageBucket: "admission-batch-26.firebasestorage.app",
      messagingSenderId: "65819980844",
      appId: "1:65819980844:web:32aaa01cb0dbc68a408d89"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let courseData = [];
    let currentUnsubscribe = null;
    window.isAuthAction = false; 

    // Reliable cross-browser session token generator
    const generateSessionToken = () => Date.now().toString(36) + Math.random().toString(36).substring(2);

    // --- ROCK-SOLID ANTI-ACCOUNT SHARING & FAST RESTORE ---
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUnsubscribe = onSnapshot(doc(db, "students", user.uid), (docSnap) => {
          if (docSnap.exists()) {
            const data = docSnap.data();
            const dbSession = data.currentSessionId;
            const localSession = localStorage.getItem("mySecureSession");

            // KICK-OUT TRIGGER
            if (dbSession && dbSession !== localSession && !window.isAuthAction) {
              sessionStorage.removeItem("courseNavState"); // Clear memory on kick out
              alert("SECURITY ALERT: Your account was logged in from another device. You have been disconnected.");
              signOut(auth);
              return;
            }

            if (data.status === "APPROVED") {
              showCourseContainer();
              if (courseData.length === 0) {
                 loadSecureClasses();
              }
            } else {
              showPendingView(data.trxId || "Pending");
            }
          }
        });
      } else {
        if(currentUnsubscribe) currentUnsubscribe();
        sessionStorage.removeItem("courseNavState"); // Clear memory on logout
        showAuthView();
      }
    });

    window.handleSignUp = async () => {
      window.isAuthAction = true;
      const email = document.getElementById("reg-email").value.trim();
      const pass = document.getElementById("reg-pass").value;
      const name = document.getElementById("reg-name").value.trim();
      const trxId = document.getElementById("reg-trx").value.trim();
      
      if (!email || !pass || !name || !trxId) {
        window.isAuthAction = false;
        return alert("All fields are required!");
      }

      try {
        const res = await createUserWithEmailAndPassword(auth, email, pass);
        const newSession = generateSessionToken();
        localStorage.setItem("mySecureSession", newSession);
        
        await setDoc(doc(db, "students", res.user.uid), {
          name, email, trxId, status: "PENDING", currentSessionId: newSession
        }, { merge: true });
        
        setTimeout(() => { window.isAuthAction = false; }, 2000);
      } catch (err) { 
        window.isAuthAction = false;
        alert("Registration Error: " + err.message); 
      }
    };

    window.handleLogin = async () => {
      window.isAuthAction = true;
      const email = document.getElementById("login-email").value.trim();
      const pass = document.getElementById("login-pass").value;
      
      if (!email || !pass) {
        window.isAuthAction = false;
        return alert("Enter email and password!");
      }
      
      try {
        const res = await signInWithEmailAndPassword(auth, email, pass);
        const newSession = generateSessionToken();
        localStorage.setItem("mySecureSession", newSession);
        
        await setDoc(doc(db, "students", res.user.uid), { currentSessionId: newSession }, { merge: true });
        
        setTimeout(() => { window.isAuthAction = false; }, 2000);
      } catch (err) { 
        window.isAuthAction = false;
        alert("Login failed. Check your credentials."); 
      }
    };

    window.handleLogout = () => signOut(auth);

    async function loadSecureClasses() {
      try {
        const querySnapshot = await getDocs(collection(db, "classes"));
        courseData = [];
        querySnapshot.forEach((doc) => { courseData.push(doc.data()); });
        restoreNavigationState(); // Check memory before rendering default subjects
      } catch (error) {
        console.error("Access Denied", error);
      }
    }

    window.courseData = () => courseData;

    // --- STATE PRESERVATION (REFRESH RESTORE) ---
    function saveNavigationState(state) {
      sessionStorage.setItem("courseNavState", JSON.stringify(state));
    }

    function restoreNavigationState() {
      const savedState = sessionStorage.getItem("courseNavState");
      if (savedState) {
        const state = JSON.parse(savedState);
        if (state.view === 'subjects') window.renderSubjects(false);
        else if (state.view === 'chapters') window.renderChapters(state.subject, false);
        else if (state.view === 'classes') window.renderClasses(state.subject, state.chapter, false);
        else if (state.view === 'video') window.launchVideoDashboard(state.cls, state.allChapterClasses, false);
      } else {
        window.renderSubjects(false);
      }
    }

    window.saveNavigationState = saveNavigationState;
  </script>
</head>

<body class="bg-[#0b1121] text-slate-100 min-h-screen font-sans" style="background-image: linear-gradient(to bottom, rgba(11, 17, 33, 0.85), rgba(15, 23, 42, 0.98)), url('https://images.unsplash.com/photo-1572949645841-094f3a9c4c94?q=80&w=2000&auto=format&fit=crop'); background-size: cover; background-attachment: fixed; background-position: center;">
  
  <nav class="glass-nav border-b border-indigo-900/40 px-6 py-4 flex justify-between items-center sticky top-0 z-50 shadow-2xl">
    <div class="flex items-center space-x-3 cursor-pointer" onclick="renderSubjects()">
      <span class="text-indigo-500 text-2xl"><i class="fa-solid fa-graduation-cap"></i></span>
      <h1 class="text-lg font-bold tracking-widest text-white">APAR'S <span class="text-xs font-normal text-slate-400 tracking-normal hidden sm:inline ml-2">Varsity Admission Batch 26</span></h1>
    </div>
    <div id="nav-actions" class="hidden flex items-center space-x-4">
      <button class="w-8 h-8 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center hover:bg-slate-700 transition"><i class="fa-regular fa-bell"></i></button>
      <button onclick="handleLogout()" class="text-xs font-bold bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white px-4 py-2 rounded-lg border border-red-900/50 transition">Logout</button>
    </div>
  </nav>

  <!-- Initial Loader to prevent login flash -->
  <div id="view-loader" class="flex flex-col items-center justify-center mt-32">
    <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
    <p class="text-slate-400 text-sm tracking-wider">Verifying Session...</p>
  </div>

  <!-- Login/Reg View -->
  <div id="view-auth" class="hidden max-w-md mx-auto mt-20 p-6 bg-[#151e32]/90 backdrop-blur-md rounded-2xl border border-slate-700 shadow-2xl">
    <div class="flex border-b border-slate-700 mb-6">
      <button onclick="toggleAuthTab('login')" id="tab-login" class="flex-1 py-3 font-bold text-indigo-400 border-b-2 border-indigo-500 transition">Login</button>
      <button onclick="toggleAuthTab('signup')" id="tab-signup" class="flex-1 py-3 font-bold text-slate-500 transition">Register</button>
    </div>
    
    <div id="form-login" class="space-y-4">
      <input id="login-email" type="email" placeholder="Gmail Address" class="w-full bg-[#0b1121] border border-slate-700 rounded-lg p-4 text-white focus:outline-none focus:border-indigo-500">
      <input id="login-pass" type="password" placeholder="Password" class="w-full bg-[#0b1121] border border-slate-700 rounded-lg p-4 text-white focus:outline-none focus:border-indigo-500">
      <button onclick="handleLogin()" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-4 rounded-lg transition shadow-lg shadow-indigo-600/20">Enter Course</button>
    </div>

    <div id="form-signup" class="space-y-4 hidden">
      <input id="reg-name" type="text" placeholder="Full Name" class="w-full bg-[#0b1121] border border-slate-700 rounded-lg p-4 text-white focus:outline-none focus:border-indigo-500">
      <input id="reg-email" type="email" placeholder="Gmail Address" class="w-full bg-[#0b1121] border border-slate-700 rounded-lg p-4 text-white focus:outline-none focus:border-indigo-500">
      <input id="reg-pass" type="password" placeholder="Set Password" class="w-full bg-[#0b1121] border border-slate-700 rounded-lg p-4 text-white focus:outline-none focus:border-indigo-500">
      <input id="reg-trx" type="text" placeholder="bKash/Nagad TrxID" class="w-full bg-[#0b1121] border border-slate-700 rounded-lg p-4 text-white focus:outline-none focus:border-indigo-500">
      <button onclick="handleSignUp()" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-4 rounded-lg transition shadow-lg shadow-emerald-600/20">Register & Pay</button>
    </div>
  </div>

  <!-- Pending View -->
  <div id="view-pending" class="hidden max-w-lg mx-auto mt-24 p-8 bg-[#151e32]/90 backdrop-blur-md rounded-2xl border border-amber-600/40 text-center shadow-2xl">
    <div class="text-5xl text-amber-500 mb-4"><i class="fa-solid fa-clock-rotate-left"></i></div>
    <h2 class="text-2xl font-bold mb-2 text-white">Waiting for Verification</h2>
    <p class="text-slate-400 text-sm mb-6">TrxID: <span id="pending-trx" class="text-amber-400 font-mono font-bold"></span><br>Your payment is being manually verified. Access will be granted shortly.</p>
    <button onclick="location.reload()" class="bg-slate-800 hover:bg-slate-700 text-white px-6 py-2 rounded-full border border-slate-600 transition">Refresh Status</button>
  </div>

  <!-- Main Course Container -->
  <div id="view-course" class="hidden max-w-6xl mx-auto px-4 py-8 relative min-h-screen">
    
    <!-- STATE 1: Subjects Grid (Perfectly Even) -->
    <div id="state-subjects" class="hidden">
      <h2 class="text-center text-slate-300 font-medium tracking-widest mb-8 uppercase text-sm">Subjects</h2>
      <div id="subjects-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 justify-center w-full"></div>
    </div>

    <!-- STATE 2: Chapters Grid (Perfectly Even) -->
    <div id="state-chapters" class="hidden">
      <div class="flex items-center mb-8 relative">
        <button onclick="renderSubjects()" class="absolute left-0 bg-emerald-900/40 text-emerald-400 border border-emerald-700/50 hover:bg-emerald-800 px-4 py-1.5 rounded-full text-sm font-bold transition flex items-center space-x-2"><i class="fa-solid fa-arrow-left"></i><span>Back</span></button>
        <div class="w-full text-center">
          <h2 id="chapter-view-title" class="text-2xl font-bold text-blue-400 drop-shadow-md"></h2>
          <p class="text-slate-400 text-sm mt-1">Chapters</p>
        </div>
      </div>
      <div id="chapters-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 w-full"></div>
    </div>

    <!-- STATE 3: Classes Grid (Perfectly Even) -->
    <div id="state-classes" class="hidden">
      <div class="flex items-center mb-8 relative">
        <button onclick="document.getElementById('state-classes').classList.add('hidden'); document.getElementById('state-chapters').classList.remove('hidden'); window.saveNavigationState({view: 'chapters', subject: document.getElementById('chapter-view-title').innerText});" class="absolute left-0 bg-emerald-900/40 text-emerald-400 border border-emerald-700/50 hover:bg-emerald-800 px-4 py-1.5 rounded-full text-sm font-bold transition flex items-center space-x-2"><i class="fa-solid fa-arrow-left"></i><span>Back</span></button>
        <div class="w-full text-center">
          <h2 id="class-view-title" class="text-2xl font-bold text-purple-400 drop-shadow-md"></h2>
          <p class="text-slate-400 text-sm mt-1">Classes</p>
        </div>
      </div>
      <div id="classes-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 w-full"></div>
    </div>

    <!-- STATE 4: Video Dashboard -->
    <div id="state-video" class="hidden bg-[#0b1121] border border-slate-800 rounded-2xl overflow-hidden shadow-2xl">
      <div class="bg-[#151e32] p-4 flex items-center border-b border-slate-800">
        <button onclick="document.getElementById('state-video').classList.add('hidden'); document.getElementById('state-classes').classList.remove('hidden'); document.getElementById('main-video-iframe').src=''; window.saveNavigationState({view: 'classes', subject: window.currentSubjectCache, chapter: document.getElementById('class-view-title').innerText});" class="text-slate-400 hover:text-white mr-4"><i class="fa-solid fa-arrow-left text-xl"></i></button>
        <h2 id="dash-video-title" class="font-bold text-lg text-slate-200"></h2>
      </div>

      <!-- VIDEO PLAYER: Shields removed for full controls -->
      <div class="relative w-full aspect-video bg-black">
        <iframe id="main-video-iframe" class="w-full h-full" src="" frameborder="0" allowfullscreen></iframe>
      </div>

      <div class="bg-[#151e32] border-b border-slate-800 flex text-sm text-slate-400 overflow-x-auto">
        <button class="px-6 py-4 font-bold text-indigo-400 border-b-2 border-indigo-500 whitespace-nowrap"><i class="fa-solid fa-circle-info mr-2"></i>Info & Resources</button>
      </div>

      <div class="p-6 bg-[#0b1121]">
        <h3 class="text-white font-bold mb-4">Class Materials</h3>
        <div class="flex flex-wrap gap-4">
          <a id="btn-lecture" href="#" target="_blank" class="flex items-center space-x-3 bg-slate-800/50 hover:bg-slate-700 border border-slate-700 px-5 py-3 rounded-xl transition text-slate-300 hover:text-white">
            <span class="text-blue-400 text-xl"><i class="fa-solid fa-file-pdf"></i></span>
            <span class="font-medium text-sm">Lecture Sheet</span>
          </a>
          <a id="btn-practice" href="#" target="_blank" class="flex items-center space-x-3 bg-slate-800/50 hover:bg-slate-700 border border-slate-700 px-5 py-3 rounded-xl transition text-slate-300 hover:text-white">
            <span class="text-amber-400 text-xl"><i class="fa-solid fa-file-pen"></i></span>
            <span class="font-medium text-sm">Practice Sheet</span>
          </a>
          <a id="btn-solution" href="#" target="_blank" class="flex items-center space-x-3 bg-slate-800/50 hover:bg-slate-700 border border-slate-700 px-5 py-3 rounded-xl transition text-slate-300 hover:text-white">
            <span class="text-emerald-400 text-xl"><i class="fa-solid fa-check-double"></i></span>
            <span class="font-medium text-sm">Solution PDF</span>
          </a>
        </div>
      </div>

      <div class="bg-[#151e32] p-6 border-t border-slate-800">
        <h3 class="text-white font-bold mb-4 flex items-center"><i class="fa-solid fa-list mr-2 text-indigo-400"></i> Chapter Playlist</h3>
        <div id="playlist-container" class="space-y-2"></div>
      </div>
    </div>
  </div>

  <script>
    window.currentSubjectCache = ""; // Quick memory for back button navigation

    // View Toggles
    function hideAllStates() {
      ['state-subjects', 'state-chapters', 'state-classes', 'state-video'].forEach(id => {
        document.getElementById(id).classList.add("hidden");
      });
      window.scrollTo(0,0);
    }
    
    function showAuthView() { 
      document.getElementById("view-loader").classList.add("hidden");
      document.getElementById("view-auth").classList.remove("hidden"); 
      document.getElementById("view-pending").classList.add("hidden"); 
      document.getElementById("view-course").classList.add("hidden"); 
      document.getElementById("nav-actions").classList.add("hidden"); 
    }
    function showPendingView(trxId) { 
      document.getElementById("view-loader").classList.add("hidden");
      document.getElementById("view-auth").classList.add("hidden"); 
      document.getElementById("view-pending").classList.remove("hidden"); 
      document.getElementById("pending-trx").innerText = trxId; 
      document.getElementById("view-course").classList.add("hidden"); 
      document.getElementById("nav-actions").classList.remove("hidden"); 
    }
    function showCourseContainer() { 
      document.getElementById("view-loader").classList.add("hidden");
      document.getElementById("view-auth").classList.add("hidden"); 
      document.getElementById("view-pending").classList.add("hidden"); 
      document.getElementById("view-course").classList.remove("hidden"); 
      document.getElementById("nav-actions").classList.remove("hidden"); 
    }

    window.toggleAuthTab = (type) => {
      if (type === 'login') {
        document.getElementById("tab-login").className = "flex-1 py-3 font-bold text-indigo-400 border-b-2 border-indigo-500 transition";
        document.getElementById("tab-signup").className = "flex-1 py-3 font-bold text-slate-500 transition";
        document.getElementById("form-login").classList.remove("hidden");
        document.getElementById("form-signup").classList.add("hidden");
      } else {
        document.getElementById("tab-signup").className = "flex-1 py-3 font-bold text-emerald-400 border-b-2 border-emerald-500 transition";
        document.getElementById("tab-login").className = "flex-1 py-3 font-bold text-slate-500 transition";
        document.getElementById("form-signup").classList.remove("hidden");
        document.getElementById("form-login").classList.add("hidden");
      }
    };

    // --- RENDER LOGIC WITH MEMORY ---

    window.renderSubjects = (save = true) => {
      hideAllStates();
      if (save) window.saveNavigationState({ view: 'subjects' });
      
      const container = document.getElementById("subjects-grid");
      container.innerHTML = "";
      
      const uniqueSubjects = [...new Set(window.courseData().map(c => c.subject))];

      uniqueSubjects.forEach(sub => {
        let bgGrad = "from-slate-700 to-slate-900"; let textCol = "text-yellow-400";
        if (sub.includes("পদার্থ")) { bgGrad = "from-[#004e92] via-[#000428] to-[#0b1121]"; textCol = "text-amber-300"; } 
        else if (sub.includes("গণিত")) { bgGrad = "from-[#8a2387] via-[#e94057] to-[#0b1121]"; textCol = "text-amber-300"; } 
        else if (sub.includes("রসায়ন")) { bgGrad = "from-[#4b134f] via-[#c94b4b] to-[#0b1121]"; textCol = "text-white"; } 
        else if (sub.includes("জীব")) { bgGrad = "from-[#11998e] via-[#38ef7d] to-[#0b1121]"; textCol = "text-emerald-200"; }

        const card = document.createElement("div");
        card.className = "bg-[#0f1629] rounded-2xl overflow-hidden cursor-pointer transform hover:scale-[1.03] transition duration-300 shadow-2xl flex flex-col border border-slate-700/50 w-full";
        card.innerHTML = `
          <div class="h-32 bg-gradient-to-b ${bgGrad} flex items-center justify-center text-center p-3 relative">
             <div class="absolute inset-0 bg-black/30"></div>
             <h2 class="relative text-2xl font-extrabold ${textCol} drop-shadow-xl whitespace-pre-line leading-tight">${sub}</h2>
          </div>
          <div class="h-12 bg-[#151e32] flex items-center justify-center text-xs text-slate-400 font-medium">${sub}</div>
        `;
        card.onclick = () => renderChapters(sub);
        container.appendChild(card);
      });
      document.getElementById("state-subjects").classList.remove("hidden");
    };

    window.renderChapters = (subjectName, save = true) => {
      hideAllStates();
      if (save) window.saveNavigationState({ view: 'chapters', subject: subjectName });
      window.currentSubjectCache = subjectName;

      document.getElementById("chapter-view-title").innerText = subjectName;
      const container = document.getElementById("chapters-grid");
      container.innerHTML = "";

      const subjectClasses = window.courseData().filter(c => c.subject === subjectName);
      const uniqueChapters = [...new Set(subjectClasses.map(c => c.chapter))];

      uniqueChapters.forEach(chap => {
        const card = document.createElement("div");
        card.className = "bg-gradient-to-br from-[#1a233a] to-[#0f1629] border border-slate-700/50 hover:border-indigo-500/50 rounded-2xl p-6 cursor-pointer transform hover:-translate-y-1 transition duration-300 shadow-xl flex flex-col items-center justify-center text-center h-40 w-full";
        card.innerHTML = `
          <h3 class="text-xl font-bold text-amber-400 mb-2 drop-shadow-md">${chap.split(':')[1] || chap}</h3>
          <p class="text-xs font-bold text-slate-300 bg-slate-800/80 px-3 py-1 rounded-full">${chap}</p>
        `;
        card.onclick = () => renderClasses(subjectName, chap);
        container.appendChild(card);
      });
      document.getElementById("state-chapters").classList.remove("hidden");
    };

    window.renderClasses = (subjectName, chapterName, save = true) => {
      hideAllStates();
      if (save) window.saveNavigationState({ view: 'classes', subject: subjectName, chapter: chapterName });
      window.currentSubjectCache = subjectName;

      document.getElementById("class-view-title").innerText = chapterName;
      const container = document.getElementById("classes-grid");
      container.innerHTML = "";

      const chapClasses = window.courseData().filter(c => c.subject === subjectName && c.chapter === chapterName);

      chapClasses.forEach(cls => {
        const thumbUrl = `https://img.youtube.com/vi/${cls.youtube_id}/maxresdefault.jpg`;
        const card = document.createElement("div");
        card.className = "bg-[#151e32] border border-slate-800 hover:border-slate-600 rounded-xl overflow-hidden cursor-pointer group shadow-lg flex flex-col w-full";
        card.innerHTML = `
          <div class="relative w-full aspect-video bg-black overflow-hidden">
            <img src="${thumbUrl}" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 group-hover:scale-105 transition duration-500" onerror="this.src='https://images.unsplash.com/photo-1633356122544-f134324a6cee?q=80&w=600&auto=format&fit=crop';">
            <div class="absolute inset-0 flex items-center justify-center">
               <div class="w-12 h-12 bg-red-600/90 rounded-full flex items-center justify-center text-white shadow-xl shadow-red-900/50 group-hover:scale-110 transition"><i class="fa-solid fa-play ml-1"></i></div>
            </div>
          </div>
          <div class="p-4 flex-grow flex flex-col justify-between bg-gradient-to-b from-[#151e32] to-[#0b1121]">
            <h4 class="font-bold text-sm text-slate-200 leading-snug mb-3">${cls.class_title}</h4>
            <div class="flex space-x-2">
              ${cls.lecture_pdf ? '<span class="text-[10px] bg-blue-900/40 text-blue-300 border border-blue-800 px-2 py-1 rounded">Lecture Sheet</span>' : ''}
              ${cls.question_pdf ? '<span class="text-[10px] bg-amber-900/40 text-amber-300 border border-amber-800 px-2 py-1 rounded">Practice</span>' : ''}
            </div>
          </div>
        `;
        card.onclick = () => launchVideoDashboard(cls, chapClasses);
        container.appendChild(card);
      });
      document.getElementById("state-classes").classList.remove("hidden");
    };

    window.launchVideoDashboard = (cls, allChapterClasses, save = true) => {
      hideAllStates();
      if (save) window.saveNavigationState({ view: 'video', cls: cls, allChapterClasses: allChapterClasses });
      
      document.getElementById("dash-video-title").innerText = cls.class_title;
      
      // Removed modestbranding and disablekb to allow native controls and fullscreen capability
      const secureUrl = `https://www.youtube.com/embed/${cls.youtube_id}?autoplay=1&rel=0&playsinline=1`;
      document.getElementById("main-video-iframe").src = secureUrl;
      
      document.getElementById("btn-lecture").href = cls.lecture_pdf || "#";
      document.getElementById("btn-lecture").style.display = cls.lecture_pdf ? "flex" : "none";
      document.getElementById("btn-practice").href = cls.question_pdf || "#";
      document.getElementById("btn-practice").style.display = cls.question_pdf ? "flex" : "none";
      document.getElementById("btn-solution").href = cls.answer_pdf || "#";
      document.getElementById("btn-solution").style.display = cls.answer_pdf ? "flex" : "none";

      const playlist = document.getElementById("playlist-container");
      playlist.innerHTML = "";
      allChapterClasses.forEach(item => {
        const isCurrent = item.youtube_id === cls.youtube_id;
        const row = document.createElement("div");
        row.className = `flex items-center p-3 rounded-xl cursor-pointer transition ${isCurrent ? 'bg-indigo-900/30 border border-indigo-700/50' : 'hover:bg-slate-800 border border-transparent'}`;
        row.innerHTML = `
          <div class="w-24 aspect-video bg-black rounded overflow-hidden flex-shrink-0 relative mr-4">
             <img src="https://img.youtube.com/vi/${item.youtube_id}/mqdefault.jpg" class="w-full h-full object-cover opacity-70">
             ${isCurrent ? '<div class="absolute inset-0 bg-indigo-600/40 flex items-center justify-center"><i class="fa-solid fa-play text-white text-xs"></i></div>' : ''}
          </div>
          <div class="flex-grow">
             <h5 class="text-sm font-bold ${isCurrent ? 'text-indigo-300' : 'text-slate-300'}">${item.class_title}</h5>
          </div>
        `;
        if (!isCurrent) row.onclick = () => launchVideoDashboard(item, allChapterClasses);
        playlist.appendChild(row);
      });

      document.getElementById("state-video").classList.remove("hidden");
    };
  </script>
</body>
</html>
